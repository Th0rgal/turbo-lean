name: Nightly Conformance (Tier C2 Ecosystem Packages & 10k-Seed Tier C4 Alias Fuzz)

on:
  schedule:
    # 03:17 UTC daily; off the top of the hour to dodge scheduler congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: "4"
  PYTHONNOUSERSITE: "1"
  PYTHONUNBUFFERED: "1"
  TURBO_LEAN_HOME: ${{ github.workspace }}/.turbo-cache
  # lean.ci guests export their remote cache to every job; turbo-lean's own tests must
  # not read it (an empty value disables it), or modules come back cached, not compiled.
  TURBO_LEAN_REMOTE_CACHE: ""
  TURBO_LEAN_REMOTE_TOKEN: ""

jobs:
  nightly-conformance:
    name: Nightly Tier C2 (fixtures + pinned Batteries driver) & Tier C4 10k-seed alias fuzz (ASan/UBSan)
    runs-on: ${{ vars.TURBO_LEAN_LEAN_RUNNERS == 'true' && github.repository == 'Th0rgal/turbo-lean' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # 10,000 C4 seeds measured 521 s on a 192-core host; the 4-vCPU runner needs a
    # generous multiple of that on top of the Lean build and the C2 package corpus.
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision sanitizer & compiler runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-rt-dev llvm gcc

      - name: Cache Lean toolchain and LeanNative build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            lean/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-nightly-conformance-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nightly-conformance-lean-
            ${{ runner.os }}-${{ runner.arch }}-roadmap-cargo-lean-

      - name: Cache pinned Tier C2 external ecosystem builds (leanprover-community/batteries)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo-cache/c2-external
          key: ${{ runner.os }}-${{ runner.arch }}-c2-external-batteries-66e469188fe07963e5cf666c7d4433f45b8131c5-v1

      - name: Setup Lean 4 toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          else
            "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/lean/.lake/build/bin" >> "$GITHUB_PATH"
          (cd lean && "$HOME/.elan/bin/lean" --version)

      - name: Build LeanNative binaries
        run: |
          (cd lean && lake build lean-native lean-native-core)

      - name: Run Tier C2 3-way ASan/UBSan conformance (in-repo fixtures + pinned external Batteries driver)
        run: |
          python3 scripts/run_conformance_suite.py --tier C2 --c2-packages-dir auto --c2-external --asan --ubsan --json

      - name: Run Tier C4 10,000-seed shared/exclusive-alias LCNF fuzz (ASan/UBSan)
        run: |
          python3 scripts/fuzz_lcnf_conformance.py --seeds 10000 --asan --ubsan

  proof-mutant-sample:
    name: H1.4 proved-lowering mutant kill sample (planted-control self-test + pinned KILLED subset)
    runs-on: ${{ vars.TURBO_LEAN_LEAN_RUNNERS == 'true' && github.repository == 'Th0rgal/turbo-lean' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Each sampled mutant rebuilds the mutated bridge module plus its proof and
    # Tests dependents from a pristine .lake snapshot; the pinned sample is
    # bounded (CI_SAMPLE in scripts/proof_mutant_matrix.py). The full 60-mutant
    # matrix runs locally behind --full, not here.
    timeout-minutes: 270
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Harness self-test (planted always-survives / always-killed / stillborn controls)
        run: python3 scripts/proof_mutant_matrix.py --self-test

      - name: Cache Lean toolchain and LeanNative build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            lean/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-nightly-conformance-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nightly-conformance-lean-
            ${{ runner.os }}-${{ runner.arch }}-roadmap-cargo-lean-

      - name: Setup Lean 4 toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          else
            "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          (cd lean && "$HOME/.elan/bin/lean" --version)

      - name: Warm the baseline proofs/Tests closure the scratch worktrees seed from
        run: |
          (cd lean && lake build LeanNative)

      - name: Run the pinned mutant sample (every member must stay KILLED)
        run: |
          python3 scripts/proof_mutant_matrix.py --sample ci --workers 1
