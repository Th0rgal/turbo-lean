name: C2 Batteries Nightly Conformance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"
  PYTHONUNBUFFERED: "1"
  TURBO_LEAN_REMOTE_CACHE: ""
  TURBO_LEAN_REMOTE_TOKEN: ""

jobs:
  c2-batteries:
    name: Batteries v4.35.0 and C2 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Cache Lean and Batteries build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            lean/.lake/build
            verification/c2-lake-packages/batteries/.lake
          key: ${{ runner.os }}-c2-batteries-v435-${{ hashFiles('lean/lean-toolchain', 'verification/c2-lake-packages/batteries/lean-toolchain', 'verification/c2-lake-packages/batteries/lakefile.toml', 'verification/c2-lake-packages/batteries/lake-manifest.json') }}

      - name: Set up Lean v4.35.0
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          else
            "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build LeanNative executables
        run: (cd lean && lake build lean-native lean-native-core)

      - name: Build pinned Batteries corpus
        working-directory: verification/c2-lake-packages/batteries
        run: lake build Batteries

      - name: Run C2 conformance
        env:
          TURBO_C2_PACKAGES_DIR: auto
        run: |
          mkdir -p artifacts
          python3 scripts/run_conformance_suite.py --tier C2 --json > artifacts/c2-conformance.json

      - name: Upload C2 conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c2-conformance-${{ github.run_id }}
          path: artifacts/c2-conformance.json
          if-no-files-found: warn
