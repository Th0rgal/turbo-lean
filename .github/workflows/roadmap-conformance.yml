name: Roadmap Contract & 3-Way Conformance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LEAN_NUM_THREADS: "4"
  PYTHONNOUSERSITE: "1"
  PYTHONUNBUFFERED: "1"
  TURBO_LEAN_HOME: ${{ github.workspace }}/.turbo-cache

jobs:
  roadmap-conformance:
    name: Verify Roadmap Contract & 3-Way Differential Conformance (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Provision sanitizer & compiler runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang gcc

      - name: Cache Lean toolchain, Cargo registry, and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            ~/.cargo/registry
            ~/.cargo/git
            target
            lean/.lake/build
          key: ${{ runner.os }}-cargo-lean-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'lean/lean-toolchain', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lean-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'lean/lean-toolchain') }}-
            ${{ runner.os }}-cargo-lean-

      - name: Setup Lean 4 toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          else
            "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/lean/.lake/build/bin" >> "$GITHUB_PATH"
          (cd lean && "$HOME/.elan/bin/lean" --version)

      - name: Build LeanNative binaries and turbo-lean CLI
        run: |
          (cd lean && lake build lean-native lean-native-core)
          cargo build --release -p turbo-lean

      - name: Run Contract V5 checklist & 3-way ASan/UBSan conformance gate
        run: ./scripts/verify_roadmap_contract.sh

      - name: Run full scalar/tuple/Stage-1D frontend & SymbolicTV conformance suite
        run: python3 -m unittest -v scripts/test_scalar_frontend.py
