name: Roadmap Contract & 3-Way Conformance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LEAN_NUM_THREADS: "4"
  PYTHONNOUSERSITE: "1"
  PYTHONUNBUFFERED: "1"
  TURBO_LEAN_HOME: ${{ github.workspace }}/.turbo-cache

jobs:
  impact:
    name: Fast inventory and impact gates
    runs-on: ubuntu-latest
    outputs:
      run_lean_build: ${{ steps.plan.outputs.run_lean_build }}
      conformance_seeds: ${{ steps.plan.outputs.conformance_seeds }}
      run_conformance_full: ${{ steps.plan.outputs.run_conformance_full }}
      llvm_backend: ${{ steps.plan.outputs.llvm_backend }}
      ci_scripts: ${{ steps.plan.outputs.ci_scripts }}
      force_full: ${{ steps.plan.outputs.force_full }}
      impact_digest: ${{ steps.plan.outputs.impact_digest }}
      inputs_unchanged: ${{ steps.plan.outputs.inputs_unchanged }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 scripts/ci_impact_plan.py --self-test
          python3 scripts/sync_docs_inventory.py --check
          python3 scripts/emitter_mutants.py --unit-tests
          python3 scripts/run_llvm_lli_diff.py --self-test
          python3 scripts/run_alive2_tv.py --self-test
          python3 scripts/check_lean_mlir_bridge_sync.py --self-test
          python3 scripts/check_lean_mlir_bridge_sync.py
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD; fi
          python3 scripts/ci_impact_plan.py --base "$BASE"

  roadmap-conformance:
    needs: impact
    if: needs.impact.outputs.run_lean_build == 'true'
    name: Verify Roadmap Contract & 3-Way Differential Conformance (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Provision sanitizer & compiler runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang gcc cmake ninja-build llvm-18 llvm-18-dev llvm-18-tools libz3-dev re2c zlib1g-dev libzstd-dev

      - name: Cache Alive2 translation-validation binary (alive-tv)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/alive2-tv
          key: ${{ runner.os }}-alive2-llvm18-2547695358b01758a01f4bdab2ced70178189074-v2

      - name: Build or restore pinned Alive2 (alive-tv) binary for Stage 2B gate
        run: |
          python3 scripts/run_alive2_tv.py --self-test
          mkdir -p "$HOME/.cache/alive2-tv"
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; import run_alive2_tv as m; p = m.ensure_alive_tv(Path.home()/'.cache/alive2-tv'); print('alive-tv ready at', p)"
          echo "$HOME/.cache/alive2-tv/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain, Cargo registry, and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            ~/.cargo/registry
            ~/.cargo/git
            target
            lean/.lake/build
          key: ${{ runner.os }}-roadmap-cargo-lean-${{ needs.impact.outputs.impact_digest }}
          restore-keys: |
            ${{ runner.os }}-roadmap-cargo-lean-

      - name: Setup Lean 4 toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          else
            "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/lean/.lake/build/bin" >> "$GITHUB_PATH"
          (cd lean && "$HOME/.elan/bin/lean" --version)

      - name: Build LeanNative binaries, turbo-zygote, and turbo-lean CLI
        run: |
          (cd lean && lake build lean-native lean-native-core turbo-zygote)
          cargo build --release -p turbo-lean

      - name: Run Contract V5 checklist & 3-way ASan/UBSan conformance gate
        env:
          CONFORMANCE_SEEDS: ${{ needs.impact.outputs.conformance_seeds }}
        run: ./scripts/verify_roadmap_contract.sh

      - name: Run full scalar/tuple/Stage-1D frontend & SymbolicTV conformance suite
        run: python3 -m unittest -v scripts/test_scalar_frontend.py

  lean-mlir-bridge:
    needs: impact
    if: >-
      needs.impact.outputs.run_lean_build == 'true' &&
      (needs.impact.outputs.llvm_backend == 'true' ||
       needs.impact.outputs.ci_scripts == 'true' ||
       needs.impact.outputs.force_full == 'true')
    name: Stage 2C opencompl/lean-mlir Bisimulation Bridge (0 sorryAx)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact LLVMAst <-> lean-mlir-bridge synchronization & upstream SHA pins
        run: |
          python3 scripts/check_lean_mlir_bridge_sync.py --self-test
          python3 scripts/check_lean_mlir_bridge_sync.py --json

      - name: Cache Lean nightly toolchain & lean-mlir/Mathlib build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            verification/lean-mlir-bridge/.lake
          key: ${{ runner.os }}-lean-mlir-bridge-${{ hashFiles('verification/lean-mlir-bridge/lean-toolchain', 'verification/lean-mlir-bridge/lakefile.toml', 'verification/lean-mlir-bridge/lake-manifest.json', 'verification/lean-mlir-bridge/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lean-mlir-bridge-${{ hashFiles('verification/lean-mlir-bridge/lean-toolchain', 'verification/lean-mlir-bridge/lakefile.toml') }}-
            ${{ runner.os }}-lean-mlir-bridge-

      - name: Setup Lean toolchain for verification/lean-mlir-bridge
        run: |
          BRIDGE_TC="$(tr -d '[:space:]' < verification/lean-mlir-bridge/lean-toolchain)"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-all-errors -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$BRIDGE_TC"
          else
            "$HOME/.elan/bin/elan" toolchain install "$BRIDGE_TC"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          (cd verification/lean-mlir-bridge && "$HOME/.elan/bin/lean" --version)

      - name: Fetch Mathlib olean cache & build LeanMLIRBridge (0 sorryAx kernel audit)
        working-directory: verification/lean-mlir-bridge
        run: |
          test -f lake-manifest.json
          lake exe cache get
          lake build LeanMLIRBridge
          python3 ../../scripts/check_lean_mlir_bridge_sync.py --json

