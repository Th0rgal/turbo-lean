name: turbo-lean CI (Self-Hosted CAS & Proof Verification)

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TURBO_LEAN_HOME: ${{ github.workspace }}/.turbo-cache

jobs:
  verify:
    name: Build turbo-lean & Self-Verify Lean 4 Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry, target, lean-native-core, and Lean build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/lean-native-core
            target
            lean/.lake/build
          key: ${{ runner.os }}-cargo-lean-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'lean/lean-toolchain', 'lean/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lean-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'lean/lean-toolchain') }}-
            ${{ runner.os }}-cargo-lean-

      - name: Install Elan & Lean 4 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          (cd lean && "$HOME/.elan/bin/lean" --version)

      - name: Build or restore lean-native-core v0.3 engine
        run: |
          mkdir -p "$HOME/.cargo/bin"
          if [ ! -x "$HOME/.cargo/bin/lean-native-core" ]; then
            git clone --depth 1 https://github.com/Th0rgal/lean-native /tmp/lean-native
            (cd /tmp/lean-native && "$HOME/.elan/bin/lake" build lean-native-core)
            cp /tmp/lean-native/.lake/build/bin/lean-native-core "$HOME/.cargo/bin/lean-native-core"
          fi
          "$HOME/.cargo/bin/lean-native-core" --help | head -n 5

      - name: Restore turbo-lean portable CAS bundle (.tlpack)
        uses: actions/cache@v4
        with:
          path: .turbo-pack
          key: turbo-lean-cas-${{ hashFiles('lean/lean-toolchain', 'lean/**/*.lean') }}
          restore-keys: |
            turbo-lean-cas-

      - name: Build & Test turbo-lean CLI
        run: |
          (cd lean && lake build)
          cargo build --release
          cargo test --release
          ./target/release/turbo-lean --version

      - name: Import cached .tlpack bundle if present
        run: |
          mkdir -p .turbo-pack
          if [ -f .turbo-pack/cache.tlpack ]; then
            ./target/release/turbo-lean import .turbo-pack/cache.tlpack --json
          fi

      - name: Self-Verify Lean 4 Proofs with turbo-lean ci-verify, verify-receipt & pr-verify
        run: |
          ./target/release/turbo-lean --json ci-verify --project-dir lean --mode ${{ github.event_name == 'pull_request' && 'untrusted' || 'trusted' }} --receipt /tmp/ci-receipt.json
          ./target/release/turbo-lean --json verify-receipt /tmp/ci-receipt.json --baseline-receipt /tmp/ci-receipt.json
          ./target/release/turbo-lean --json pr-verify --project-dir lean --base HEAD --mode ${{ github.event_name == 'pull_request' && 'untrusted' || 'trusted' }}
          # Re-run to verify instant CAS hit!
          ./target/release/turbo-lean build --project-dir lean --json

      - name: Test Theorem-Level Sharding & PrefixEnv Cache
        run: |
          ./target/release/turbo-lean check lean/TurboLean/Reflection.lean --decl lookup_chain_sound --project-dir lean --json
          ./target/release/turbo-lean check lean/TurboLean/Reflection.lean --decl lookup_chain_sound --project-dir lean --json
          ./target/release/turbo-lean seed-shards --project-dir lean --json
          ./target/release/turbo-lean check lean/TurboLean --project-dir lean --json

      - name: Dogfood agent-step, audit-spec & Auto-Research Evaluation Suite
        run: |
          ./target/release/turbo-lean agent-step lean/TurboLean/Reflection.lean --decl lookup_chain_sound --project-dir lean --json
          ./target/release/turbo-lean audit-spec lean/TurboLean/FastCheck.lean --json
          python3 autoresearch/run_eval.py

      - name: Dogfood Composite GitHub Action (action.yml) on TurboLean/Spec.lean
        uses: ./
        with:
          project-dir: lean
          command: check
          check-file: lean/TurboLean/Spec.lean

      - name: Run GDSF Garbage Collection & Export Portable CAS Bundle
        run: |
          ./target/release/turbo-lean status --json
          ./target/release/turbo-lean gc --max-reclaimable-bytes 2147483648 --json
          ./target/release/turbo-lean export -o .turbo-pack/cache.tlpack --json
