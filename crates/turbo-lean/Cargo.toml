[package]
name = "turbo-lean"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance, distributed build, verification, and counterexample CLI & coordinator for Lean 4"

[[bin]]
name = "turbo-lean"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
