name: "turbo-lean Cache & Proof Verification"
description: "Two-level proof-irrelevant CAS caching (.tlpack), Singleflight build, GDSF garbage collection, and kernel/axiom CI verification for Lean 4 repositories."
author: "Th0rgal"

branding:
  icon: "zap"
  color: "blue"

inputs:
  project-dir:
    description: "Path to the Lean 4 project root directory (containing lakefile.lean / lean-toolchain)"
    required: false
    default: "."
  command:
    description: "turbo-lean workflow command to execute: 'ci-verify', 'pr-verify', 'build', 'seed-shards', 'check', 'agent-step', 'audit-spec', 'remote-prebuild', or 'cache-only'"
    required: false
    default: "ci-verify"
  seed-shards:
    description: "Seed TheoremProofCAS after successful build / ci-verify ('true' or 'false')"
    required: false
    default: "true"
  mode:
    description: "Verification trust mode for ci-verify / pr-verify: 'auto' (untrusted on pull_request, trusted on push), 'trusted', or 'untrusted'"
    required: false
    default: "auto"
  base-ref:
    description: "Baseline git reference when command is 'pr-verify' (e.g. HEAD or origin/main)"
    required: false
    default: "HEAD"
  disallow-statement-changes:
    description: "Fail closed on theorem statement or definition signature changes when command is 'pr-verify' ('true' or 'false')"
    required: false
    default: "false"
  receipt-path:
    description: "Optional file path to emit a cryptographic BLAKE3 verification receipt JSON (for 'ci-verify' or 'pr-verify')"
    required: false
    default: ""
  targets:
    description: "Optional space-separated Lake targets when command is 'build'"
    required: false
    default: ""
  check-file:
    description: "Target .lean file or directory when command is 'check', 'agent-step', or 'audit-spec'"
    required: false
    default: ""
  check-decl:
    description: "Optional theorem/lemma declaration name when command is 'check', 'agent-step', or 'audit-spec'"
    required: false
    default: ""
  cache-key-prefix:
    description: "Prefix for the portable .tlpack CAS cache key"
    required: false
    default: "turbo-lean-cas"
  max-reclaimable-bytes:
    description: "Maximum reclaimable bytes retained during GDSF garbage collection (default: 2 GiB)"
    required: false
    default: "2147483648"
  remote-sync-url:
    description: "Optional remote turbo-lean server URL (e.g. http://dgx-spark:9400) for cross-architecture CAS sync"
    required: false
    default: ""
  remote-prebuild-url:
    description: "Optional remote prebuild endpoint URL when command is 'remote-prebuild'"
    required: false
    default: ""
  remote-prebuild-output:
    description: "Optional output path for downloaded artifact when command is 'remote-prebuild'"
    required: false
    default: ""
  remote-prebuild-format:
    description: "Optional artifact format hint when command is 'remote-prebuild' (e.g. 'export.zst')"
    required: false
    default: ""
  remote-prebuild-timeout-secs:
    description: "Timeout in seconds before 'remote-prebuild' returns status='fallback'"
    required: false
    default: "300"

outputs:
  interface-hash:
    description: "Proof-irrelevant InterfaceHash (BLAKE3) of the Lean 4 project"
    value: ${{ steps.run-turbo.outputs.interface_hash }}
  action-key:
    description: "Content-addressed action key for the build/verification run"
    value: ${{ steps.run-turbo.outputs.action_key }}
  status:
    description: "Result status reported by turbo-lean"
    value: ${{ steps.run-turbo.outputs.status }}
  theorem-shards:
    description: "Number of theorem shards audited/verified"
    value: ${{ steps.run-turbo.outputs.theorem_shards }}
  failing-module:
    description: "Failing Lean module reported by remote-prebuild when status is 'compile_failed'"
    value: ${{ steps.run-turbo.outputs.failing_module }}
  artifact-sha256:
    description: "Verified SHA-256 hex digest of downloaded remote-prebuild artifact"
    value: ${{ steps.run-turbo.outputs.artifact_sha256 }}

runs:
  using: "composite"
  steps:
    - name: Compute turbo-lean action source hash
      id: action-hash
      shell: bash
      run: |
        set -euo pipefail
        SRC_HASH=$(sha256sum "$GITHUB_ACTION_PATH/Cargo.lock" "$GITHUB_ACTION_PATH/crates/turbo-lean/src/"*.rs 2>/dev/null | sha256sum | awk '{print $1}')
        echo "src_hash=${SRC_HASH}" >> "$GITHUB_OUTPUT"

    - name: Cache turbo-lean CLI binary
      id: cache-bin
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/turbo-lean-action-bin
        key: turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.action-hash.outputs.src_hash }}
        restore-keys: |
          turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-

    - name: Build or install turbo-lean CLI
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        BIN_DIR="$HOME/.cache/turbo-lean-action-bin/bin"
        mkdir -p "$BIN_DIR"
        ACTION_SRC_HASH=$(sha256sum "$GITHUB_ACTION_PATH/crates/turbo-lean/src/"*.rs "$GITHUB_ACTION_PATH/Cargo.lock" 2>/dev/null | sha256sum | awk '{print $1}')
        if [ -x "$GITHUB_ACTION_PATH/target/release/turbo-lean" ]; then
          cp "$GITHUB_ACTION_PATH/target/release/turbo-lean" "$BIN_DIR/turbo-lean"
          echo "$ACTION_SRC_HASH" > "$BIN_DIR/.src_hash"
        elif [ ! -x "$BIN_DIR/turbo-lean" ] || [ "$(cat "$BIN_DIR/.src_hash" 2>/dev/null || true)" != "$ACTION_SRC_HASH" ]; then
          if ! command -v cargo >/dev/null 2>&1 || ! cargo --version | grep -Eq '1\.([89][0-9]|[1-9][0-9]{2})'; then
            if command -v rustup >/dev/null 2>&1; then
              rustup toolchain install stable --profile minimal
              rustup default stable
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          echo "Using $(cargo --version)"
          echo "Building turbo-lean release binary from $GITHUB_ACTION_PATH..."
          cargo build --release --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
          cp "$GITHUB_ACTION_PATH/target/release/turbo-lean" "$BIN_DIR/turbo-lean"
          echo "$ACTION_SRC_HASH" > "$BIN_DIR/.src_hash"
        fi
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        "$BIN_DIR/turbo-lean" --version

    - name: Restore portable turbo-lean CAS bundle (.tlpack)
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/.turbo-pack
        key: ${{ inputs.cache-key-prefix }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project-dir), format('{0}/lake-manifest.json', inputs.project-dir), format('{0}/**/*.lean', inputs.project-dir)) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project-dir), format('{0}/lake-manifest.json', inputs.project-dir)) }}-
          ${{ inputs.cache-key-prefix }}-

    - name: Import .tlpack CAS bundle & optional remote sync
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REMOTE_SYNC_URL: ${{ inputs.remote-sync-url }}
        GH_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        PACK_DIR="${RUNNER_TEMP}/.turbo-pack"
        mkdir -p "$PACK_DIR"
        IMPORT_MODE="$INPUT_MODE"
        if [ "$IMPORT_MODE" = "auto" ]; then
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            IMPORT_MODE="untrusted"
          else
            IMPORT_MODE="trusted"
          fi
        fi
        if [ -f "$PACK_DIR/cache.tlpack" ]; then
          if [ "$IMPORT_MODE" = "trusted" ]; then
            turbo-lean --json import "$PACK_DIR/cache.tlpack" --allow-unattested-trusted
          else
            turbo-lean --json import "$PACK_DIR/cache.tlpack" --trust-domain untrusted
          fi
        fi
        if [ -n "$INPUT_REMOTE_SYNC_URL" ]; then
          if [ "$IMPORT_MODE" = "trusted" ]; then
            turbo-lean sync "$INPUT_REMOTE_SYNC_URL" --allow-unattested-trusted
          else
            turbo-lean sync "$INPUT_REMOTE_SYNC_URL" --trust-domain untrusted
          fi
        fi

    - name: Execute turbo-lean
      id: run-turbo
      if: ${{ inputs.command != 'cache-only' }}
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_DISALLOW_STMT_CHANGES: ${{ inputs.disallow-statement-changes }}
        INPUT_RECEIPT_PATH: ${{ inputs.receipt-path }}
        INPUT_SEED_SHARDS: ${{ inputs.seed-shards }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_CHECK_FILE: ${{ inputs.check-file }}
        INPUT_CHECK_DECL: ${{ inputs.check-decl }}
        INPUT_REMOTE_PREBUILD_URL: ${{ inputs.remote-prebuild-url }}
        INPUT_REMOTE_PREBUILD_OUTPUT: ${{ inputs.remote-prebuild-output }}
        INPUT_REMOTE_PREBUILD_FORMAT: ${{ inputs.remote-prebuild-format }}
        INPUT_REMOTE_PREBUILD_TIMEOUT: ${{ inputs.remote-prebuild-timeout-secs }}
        GH_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        MODE="$INPUT_MODE"
        if [ "$MODE" = "auto" ]; then
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            MODE="untrusted"
          else
            MODE="trusted"
          fi
        fi

        RECEIPT_ARGS=()
        if [ -n "$INPUT_RECEIPT_PATH" ]; then
          RECEIPT_ARGS=(--receipt "$INPUT_RECEIPT_PATH")
        fi

        SEED_ARGS=()
        if [ "$INPUT_SEED_SHARDS" = "true" ]; then
          SEED_ARGS=(--seed-shards)
        fi

        OUT_JSON="${RUNNER_TEMP}/turbo-lean-result.json"
        case "$INPUT_COMMAND" in
          ci-verify)
            turbo-lean --json ci-verify --project-dir "$INPUT_PROJECT_DIR" --mode "$MODE" "${SEED_ARGS[@]}" "${RECEIPT_ARGS[@]}" | tee "$OUT_JSON"
            ;;
          pr-verify)
            PR_ARGS=(--project-dir "$INPUT_PROJECT_DIR" --base "$INPUT_BASE_REF" --mode "$MODE" "${RECEIPT_ARGS[@]}")
            if [ "$INPUT_DISALLOW_STMT_CHANGES" = "true" ]; then
              PR_ARGS+=(--disallow-statement-changes)
            fi
            turbo-lean --json pr-verify "${PR_ARGS[@]}" | tee "$OUT_JSON"
            ;;
          build)
            read -r -a TARGET_ARR <<< "$INPUT_TARGETS"
            turbo-lean --json build "${TARGET_ARR[@]}" --project-dir "$INPUT_PROJECT_DIR" --trust-domain "$MODE" "${SEED_ARGS[@]}" | tee "$OUT_JSON"
            ;;
          seed-shards)
            turbo-lean --json seed-shards --project-dir "$INPUT_PROJECT_DIR" --trust-domain "$MODE" | tee "$OUT_JSON"
            ;;
          check)
            if [ -n "$INPUT_CHECK_DECL" ]; then
              turbo-lean --json check "$INPUT_CHECK_FILE" --decl "$INPUT_CHECK_DECL" --project-dir "$INPUT_PROJECT_DIR" | tee "$OUT_JSON"
            else
              turbo-lean --json check "$INPUT_CHECK_FILE" --project-dir "$INPUT_PROJECT_DIR" | tee "$OUT_JSON"
            fi
            ;;
          agent-step)
            if [ -n "$INPUT_CHECK_DECL" ]; then
              turbo-lean --json agent-step "$INPUT_CHECK_FILE" --decl "$INPUT_CHECK_DECL" --project-dir "$INPUT_PROJECT_DIR" | tee "$OUT_JSON"
            else
              turbo-lean --json agent-step "$INPUT_CHECK_FILE" --project-dir "$INPUT_PROJECT_DIR" | tee "$OUT_JSON"
            fi
            ;;
          audit-spec)
            if [ -n "$INPUT_CHECK_DECL" ]; then
              turbo-lean --json audit-spec "$INPUT_CHECK_FILE" --decl "$INPUT_CHECK_DECL" | tee "$OUT_JSON"
            else
              turbo-lean --json audit-spec "$INPUT_CHECK_FILE" | tee "$OUT_JSON"
            fi
            ;;
          remote-prebuild)
            RP_ARGS=(--project-dir "$INPUT_PROJECT_DIR" --url "$INPUT_REMOTE_PREBUILD_URL" --timeout-secs "$INPUT_REMOTE_PREBUILD_TIMEOUT")
            if [ -n "$INPUT_REMOTE_PREBUILD_OUTPUT" ]; then
              RP_ARGS+=(--output "$INPUT_REMOTE_PREBUILD_OUTPUT")
            fi
            if [ -n "$INPUT_REMOTE_PREBUILD_FORMAT" ]; then
              RP_ARGS+=(--artifact-format "$INPUT_REMOTE_PREBUILD_FORMAT")
            fi
            if [ -n "$INPUT_TARGETS" ]; then
              RP_ARGS+=(--targets "${INPUT_TARGETS// /,}")
            fi
            turbo-lean --json remote-prebuild "${RP_ARGS[@]}" | tee "$OUT_JSON"
            ;;
          *)
            echo "Unknown turbo-lean command: $INPUT_COMMAND" >&2
            exit 1
            ;;
        esac

        python3 - "$OUT_JSON" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, sys
        data = json.load(open(sys.argv[1]))
        with open(sys.argv[2], "a") as out:
            out.write(f"interface_hash={data.get('interface_hash', '')}\n")
            out.write(f"action_key={data.get('action_key', data.get('shard_key', ''))}\n")
            out.write(f"status={data.get('status', '')}\n")
            out.write(f"theorem_shards={data.get('theorem_shards', data.get('shards_seeded', data.get('shard_hits', data.get('unchanged_theorems_count', data.get('total_shards_in_file', 0)))))}\n")
            out.write(f"failing_module={data.get('failing_module', '')}\n")
            out.write(f"artifact_sha256={data.get('artifact_sha256', '')}\n")
        with open(sys.argv[3], "a") as summary:
            summary.write("### ⚡ `turbo-lean` Verification & CAS Summary\n\n")
            summary.write("| Metric | Value |\n|---|---|\n")
            for k, v in data.items():
                summary.write(f"| `{k}` | `{v}` |\n")
            summary.write("\n")
        if data.get("verdict") == "specs_audited" and not data.get("ok"):
            sys.exit("Specification audit failed")
        PY

    - name: Run Cost-Aware GDSF GC & Export .tlpack CAS bundle
      if: always()
      shell: bash
      env:
        INPUT_MAX_RECLAIMABLE_BYTES: ${{ inputs.max-reclaimable-bytes }}
      run: |
        set -euo pipefail
        PACK_DIR="${RUNNER_TEMP}/.turbo-pack"
        mkdir -p "$PACK_DIR"
        turbo-lean --json gc --max-reclaimable-bytes "$INPUT_MAX_RECLAIMABLE_BYTES"
        turbo-lean --json export -o "$PACK_DIR/cache.tlpack"
        turbo-lean --json status

    - name: Save portable turbo-lean CAS bundle (.tlpack)
      if: always()
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/.turbo-pack
        key: ${{ inputs.cache-key-prefix }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project-dir), format('{0}/lake-manifest.json', inputs.project-dir), format('{0}/**/*.lean', inputs.project-dir)) }}
