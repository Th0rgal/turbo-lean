<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="tb-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tb-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#94A3B8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="tb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tb-bg)" stroke="url(#tb-border)" stroke-width="4"/>

  <!-- Outer double containment ring -->
  <circle cx="256" cy="256" r="190" stroke="url(#tb-ring)" stroke-width="8"/>
  <circle cx="256" cy="256" r="174" stroke="#475569" stroke-width="2.5"/>

  <!-- 6 swept crescent turbine blades -->
  <g>
    <g transform="rotate(0 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(60 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(120 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(180 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(240 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(300 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#F8FAFC" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Central hub -->
  <circle cx="256" cy="256" r="46" fill="#0F172A" stroke="#F8FAFC" stroke-width="7"/>
  <circle cx="256" cy="256" r="16" fill="#7DD3FC"/>
</svg>
