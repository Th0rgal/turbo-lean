<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 44 424 424" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="tb-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#94A3B8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="tb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Outer double containment ring -->
  <circle cx="256" cy="256" r="196" stroke="url(#tb-ring)" stroke-width="9"/>
  <circle cx="256" cy="256" r="179" stroke="#64748B" stroke-width="3"/>

  <!-- 6 swept crescent turbine blades -->
  <g>
    <g transform="rotate(0 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(60 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(120 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(180 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(240 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(300 256 256)">
      <path d="M 256 196 C 292 172, 338 124, 326 84 C 368 112, 396 168, 368 220 C 338 202, 294 198, 256 196 Z"
            fill="url(#tb-blade)" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Central hub -->
  <circle cx="256" cy="256" r="46" stroke="#E2E8F0" stroke-width="7.5"/>
  <circle cx="256" cy="256" r="17" fill="#38BDF8"/>
</svg>
